name: Dependabot auto-approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve Dependabot update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPENDABOT_PAT || github.token }}
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) return;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            if (reviews.some(review => review.state === 'APPROVED' && review.commit_id === pr.head.sha)) return;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              commit_id: pr.head.sha,
              event: 'APPROVE',
              body: 'Automatically approved Dependabot update. CI checks and manual merge still apply.'
            });