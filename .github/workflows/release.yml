name: Tag & Publish - Integrations

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tag higher than all existing versions
        run: |
          new="${GITHUB_REF_NAME}"
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -vx "$new" | sort -V | tail -n1 || true)
          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$new" | sort -V | tail -n1)" != "$new" ]; then
            echo "::error::$new is not higher than existing tag $highest"
            exit 1
          fi

  lint:
    needs: check-version
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  security:
    needs: check-version
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build-python-package:
    needs: [lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade --constraint build-constraints.txt pip
          python -m pip install --constraint build-constraints.txt build
      - name: Build package
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
        run: |
          python -m build --installer pip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: integrations-python-package
          path: dist/

  build-and-push-docker-image:
    needs: [lint, security]
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: release

  create-release:
    needs: [build-python-package, build-and-push-docker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download Python package artifacts
        uses: actions/download-artifact@v8
        with:
          name: integrations-python-package
          path: ./release-assets/packages
      - name: Prepare release assets
        run: |
          mkdir -p ./release-assets
          if [ -f "README.md" ]; then
            cp README.md ./release-assets/README.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/**/*
          generate_release_notes: true
          draft: false
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
