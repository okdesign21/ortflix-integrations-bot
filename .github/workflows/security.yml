name: Security - Ortflix Integrations

on:
  workflow_call:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

jobs:
  trufflehog:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:latest git file:///repo/ \
            --since-commit "$BASE_COMMIT" --branch "$HEAD_COMMIT" \
            --no-verification --fail --json > "$RUNNER_TEMP/history-secrets.json"

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scan on repository
        id: trivy_fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: '${{ runner.temp }}/repository-security.json'
          scanners: 'vuln,secret'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Summarize repository scan safely
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.trivy_fs.outcome }}
        run: >-
          python scripts/summarize_trivy_report.py
          "${{ runner.temp }}/repository-security.json"
          --kind repository --outcome "$SCAN_OUTCOME"
          >> "$GITHUB_STEP_SUMMARY"

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image for Integrations service
        run: |
          docker build -t ortflix-bot-addons:scan .
      - name: Check runtime without network or host media
        run: >-
          docker run --rm --network none --entrypoint python
          ortflix-bot-addons:scan -m scripts.check_runtime_image
      - name: Run Trivy scan on built image
        id: trivy_image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ortflix-bot-addons:scan'
          format: 'json'
          output: '${{ runner.temp }}/image-security.json'
          scanners: 'vuln,secret'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Summarize image scan safely
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.trivy_image.outcome }}
        run: >-
          python scripts/summarize_trivy_report.py
          "${{ runner.temp }}/image-security.json"
          --kind image --outcome "$SCAN_OUTCOME"
          >> "$GITHUB_STEP_SUMMARY"
