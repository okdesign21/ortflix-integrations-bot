name: Publish Edge Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-image
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  publish-edge:
    needs: [lint, security]
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: edge
