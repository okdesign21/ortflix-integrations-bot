name: Publish Edge Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-image
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  publish-edge:
    needs: [lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Derive dev version from last tag
        id: version
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.1.0)
          count=$(git rev-list --count "${tag}..HEAD" 2>/dev/null || git rev-list --count HEAD)
          IFS=. read -r major minor patch <<< "${tag#v}"
          echo "value=${major}.${minor}.$((patch + 1)).dev${count}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/bot-addons
            ghcr.io/${{ github.repository }}/telegram-bot
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
