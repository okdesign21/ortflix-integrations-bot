name: Scan & Publish Image

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve package version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" == release ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$CHANNEL" == edge ]]; then
            python -m pip install --constraint build-constraints.txt packaging
            resolved=$(python scripts/release_version.py edge)
            echo "value=$resolved" >> "$GITHUB_OUTPUT"
          else
            echo '::error::Unsupported image channel'
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/bot-addons
            ghcr.io/${{ github.repository }}/telegram-bot
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.channel == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
            type=raw,value=edge,enable=${{ inputs.channel == 'edge' }}
            type=sha,prefix=sha-,enable=${{ inputs.channel == 'edge' }}
      - name: Build candidate without publishing
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          load: true
          push: false
          tags: ortflix-bot-addons:candidate
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check runtime without network or host media
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: >-
          docker run --rm --network none --entrypoint python
          "$IMAGE_ID" -m scripts.check_runtime_image
      - name: Gate the exact candidate on vulnerabilities and secrets
        id: candidate_scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_LIST_ALL_PKGS: 'true'
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: json
          output: '${{ runner.temp }}/candidate-security.json'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'
      - name: Verify native runtime scan coverage
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.candidate_scan.outcome }}
        run: >-
          python scripts/summarize_trivy_report.py
          "${{ runner.temp }}/candidate-security.json"
          --kind image --outcome "$SCAN_OUTCOME" --require-native-runtime
          >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image without rebuilding
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [[ "$IMAGE_ID" == sha256:* ]] || { echo '::error::Missing candidate image ID'; exit 1; }
          [[ -n "$IMAGE_TAGS" ]] || { echo '::error::Missing image tags'; exit 1; }
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "$IMAGE_ID" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
