# Desired Radarr/Sonarr webhook connections, applied by scripts/configure_arr_webhooks.py.
# Only connections named here are managed; other connections are never changed or deleted.
# If WEBHOOK_TOKEN (or WEBHOOK_TOKEN_FILE) is set, an x-webhook-token header is added.
# Event names match the Radarr/Sonarr API "on<Event>" flags.

radarr:
  - name: Webhook
    url: http://integrations-bot:7777/api/v1/webhooks/radarr
    method: POST
    events:
      - onGrab
      - onDownload
      - onUpgrade
      - onRename
      - onMovieAdded
      - onMovieDelete
      - onMovieFileDelete
      - onMovieFileDeleteForUpgrade
      - onHealthIssue
      - onHealthRestored
      - onApplicationUpdate
      - onManualInteractionRequired

sonarr:
  - name: Webhook
    url: http://integrations-bot:7777/api/v1/webhooks/sonarr
    method: POST
    events:
      - onGrab
      - onDownload
      - onUpgrade
      - onImportComplete
      - onRename
      - onSeriesAdd
      - onSeriesDelete
      - onEpisodeFileDelete
      - onEpisodeFileDeleteForUpgrade
      - onHealthIssue
      - onHealthRestored
      - onApplicationUpdate
      - onManualInteractionRequired
