# Desired Radarr/Sonarr/Seerr/Tautulli webhook connections, applied by scripts/configure_arr_webhooks.py.
# Only connections named here are managed; other connections are never changed or deleted.
# If WEBHOOK_TOKEN (or WEBHOOK_TOKEN_FILE) is set, an x-webhook-token header is added.
# Radarr/Sonarr event names match the API "on<Event>" flags; Seerr uses notification type names.

radarr:
  - name: Webhook
    url: http://integrations-bot:7777/api/v1/webhooks/radarr
    method: POST
    events:
      - onGrab
      - onDownload
      - onUpgrade
      - onRename
      - onMovieAdded
      - onMovieDelete
      - onMovieFileDelete
      - onMovieFileDeleteForUpgrade
      - onHealthIssue
      - onHealthRestored
      - onApplicationUpdate
      - onManualInteractionRequired

sonarr:
  - name: Webhook
    url: http://integrations-bot:7777/api/v1/webhooks/sonarr
    method: POST
    events:
      - onGrab
      - onDownload
      - onUpgrade
      - onImportComplete
      - onRename
      - onSeriesAdd
      - onSeriesDelete
      - onEpisodeFileDelete
      - onEpisodeFileDeleteForUpgrade
      - onHealthIssue
      - onHealthRestored
      - onApplicationUpdate
      - onManualInteractionRequired

# Seerr has a single webhook agent. The payload template is read from json_payload_file
# (relative to this file); omit it to leave the existing payload unchanged.
seerr:
  enabled: true
  embed_poster: true
  url: http://integrations-bot:7777/api/v1/webhooks/overseerr
  json_payload_file: seerr_webhook_payload.json
  events:
    - MEDIA_PENDING
    - MEDIA_AVAILABLE
    - MEDIA_FAILED
    - ISSUE_CREATED
    - ISSUE_COMMENT
    - ISSUE_REOPENED

# Tautulli notifiers are matched by name and must be Webhook agents. Events are Tautulli
# trigger names; json_data_file (relative to this file) is the JSON body sent for each
# trigger. TAUTULLI_API_KEY (and optionally TAUTULLI_URL) are needed to apply.
tautulli:
  - name: Integrations bot - watched
    url: http://integrations-bot:7777/api/v1/webhooks/tautulli
    method: POST
    events:
      - on_watched
    json_data_file: tautulli_watched_body.json
    custom_conditions:
      - parameter: media_type
        operator: is
        value: [movie]
        type: str
